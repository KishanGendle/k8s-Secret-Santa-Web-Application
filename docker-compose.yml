version: '3.9'

services:
  flask-app:
    image: kishangendle/secret-santa-app:latest
    ports:
      - "5000:5000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: secret_santa_db

    networks:
      - secret-santa-network
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: secret_santa_db
    networks:
      - secret-santa-network
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
      - mysql_data:/var/lib/mysql

networks:
  secret-santa-network:

volumes:
  mysql_data:
