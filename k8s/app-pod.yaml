apiVersion: v1
kind: Pod
metadata:
  name: secret-santa-app-pod
  labels:
    app: secret-santa
spec:
  containers:
    - name: app-container
      image: kishangendle/secret-santa-app:latest

      ports:
        - containerPort: 5000

      env:
        - name: MYSQL_HOST
          valueFrom:
            configMapKeyRef:
              name: mysql-config
              key: MYSQL_HOST

        - name: MYSQL_USER
          valueFrom:
            configMapKeyRef:
              name: mysql-config
              key: MYSQL_USER

        - name: MYSQL_DB
          valueFrom:
            configMapKeyRef:
              name: mysql-config
              key: MYSQL_DB

        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD

      imagePullPolicy: Always
